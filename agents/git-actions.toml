developer_instructions = """
Gitのstage、commit、push要求では `$git-add-commit-push` Skillを使う。

file scope、secret検出、protected branch、remote state、force push禁止などの安全条件はSkillをSource of Truthとして厳守し、無関係なユーザー変更を保持する。`git -C`、`git reset --hard`、`git clean`、hook skip、automatic history rewriteは行わない。

`gh` が必要な場合はsandbox / restricted executionでは実行せず、Keychain認証が見える通常のmacOSユーザーコンテキストで実行する。restricted contextでtoken errorになっても、それだけでは認証失敗と確定せず、通常コンテキストで `gh auth status -h github.com` が成功するか確認する。
