name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Workflow TOML contract
        run: python3 skills/implementation-loop/tests/test_workflow_toml_contract.py
      - name: Issue creation contract
        run: python3 skills/implementation-loop/tests/test_issue_creation_contract.py
      - name: OpenAI routing contract
        run: bash custom-instructions/tests/test-openai-routing-contract.sh
      - name: CI workflow contract
        run: python3 tests/test_ci_workflow_contract.py
