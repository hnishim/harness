schema_version = 1

[[routes]]
status = "Backlog"
action = "planning"

[[routes]]
status = "Todo"
action = "planning"

[[routes]]
status = "In Plan Review"
action = "plan_review"

[[routes]]
status = "Test Implementation"
action = "test_implementation"

[[routes]]
status = "In Test Review"
action = "test_review"

[[routes]]
status = "Implementation"
action = "implementation"

[[routes]]
status = "In Implementation Review"
action = "implementation_or_result_review"

[[routes]]
status = "Awaiting Acceptance"
action = "acceptance"

[[routes]]
status = "Done"
action = "none"

[[transitions]]
from = "Backlog"
decision = "PLAN_READY"
to = "In Plan Review"

[[transitions]]
from = "Todo"
decision = "PLAN_READY"
to = "In Plan Review"

[[transitions]]
from = "In Plan Review"
decision = "APPROVE"
test_decision = "Test required"
to = "Test Implementation"

[[transitions]]
from = "In Plan Review"
decision = "APPROVE"
test_decision = "Test not required"
to = "Implementation"

[[transitions]]
from = "In Plan Review"
decision = "CHANGES_REQUIRED"
to = "Todo"

[[transitions]]
from = "In Test Review"
decision = "TESTS_APPROVED"
to = "Implementation"

[[transitions]]
from = "In Test Review"
decision = "TESTS_CHANGES_REQUIRED"
to = "Test Implementation"

[[transitions]]
from = "In Test Review"
decision = "PLAN_INCOMPLETE"
to = "Todo"

[[transitions]]
from = "Implementation"
decision = "IMPLEMENTATION_COMPLETE"
test_decision = "Test required"
to = "Awaiting Acceptance"

[[transitions]]
from = "Implementation"
decision = "IMPLEMENTATION_COMPLETE"
test_decision = "Test not required"
to = "In Implementation Review"

[[transitions]]
from = "In Implementation Review"
decision = "APPROVE"
mode = "normal"
to = "Awaiting Acceptance"

[[transitions]]
from = "In Implementation Review"
decision = "CHANGES_REQUIRED"
mode = "normal"
to = "Implementation"

[[transitions]]
from = "In Implementation Review"
decision = "DECISION_READY"
mode = "spike"
to = "In Implementation Review"

[[transitions]]
from = "Awaiting Acceptance"
decision = "ACCEPTANCE_FAILED"
to = "Implementation"

[[transitions]]
from = "Awaiting Acceptance"
decision = "CLOSE_COMPLETE"
to = "Done"

[actions.planning]
required_capabilities = ["linear_read", "linear_write", "repository_read"]
on_missing_capability = "stay"

[actions.plan_review]
required_capabilities = ["independent_reviewer"]
on_missing_capability = "stay"

[actions.test_implementation]
required_capabilities = ["linear_read", "linear_write", "repository_read", "repository_write"]
on_missing_capability = "stay"

[actions.test_review]
required_capabilities = ["independent_reviewer"]
on_missing_capability = "stay"

[actions.implementation]
required_capabilities = ["linear_read", "linear_write", "repository_read", "repository_write"]
on_missing_capability = "stay"

[actions.implementation_review]
required_capabilities = ["independent_reviewer"]
on_missing_capability = "stay"

[actions.spike_result_review]
required_capabilities = ["independent_reviewer"]
on_missing_capability = "stay"

[actions.acceptance]
required_capabilities = ["linear_read"]
on_missing_capability = "stay"

[actions.close]
required_capabilities = ["linear_read", "linear_write", "repository_read", "repository_write"]
on_missing_capability = "stay"

[capabilities]
linear_read = "runtime"
linear_write = "runtime"
repository_read = "runtime"
repository_write = "runtime"
local_git = "runtime"
github_read = "runtime"
github_write = "runtime"
independent_reviewer = "runtime"
strict_reviewer = "runtime"
local_acceptance = "runtime"
ci_observation = "runtime"

[modes.normal]
allowed = true

[modes.spike]
allowed = true
result_artifact = "result"

[modes.bug]
allowed = true
required_test_decision = "Test required"
requires_root_cause = true

[profiles.lightweight]
required_capabilities = []

[profiles.strict]
required_capabilities = ["strict_reviewer"]

[bindings.plan]
fields = ["comment_id", "current_hash", "approved_hash", "decision"]

[bindings.tests]
manifest_fields = [
  "paths",
  "content_sha256",
  "manifest_hash",
  "rerun_command",
  "manual_checks",
  "unverified",
  "test_lifetimes",
]
[bindings.tests.lifetime_record]
classifications = ["transitional", "permanent_regression"]
fields = [
  "test_id",
  "classification",
  "end_condition",
  "retention_reason",
]

[bindings.candidate]
fields = ["baseline_sha", "candidate_sha", "candidate_ref"]

[bindings.acceptance]
fields = ["candidate_sha", "local_acceptance", "human_acceptance"]

[bindings.spike_result]
fields = ["current_result_hash", "reviewed_result_hash", "decision"]
close_requires_current_reviewed_match = true

[invalidation.plan_hash]
invalidates = ["plan_review", "test_review", "implementation_review", "ci", "local_acceptance", "human_acceptance"]

[invalidation.approved_tests_manifest]
invalidates = ["test_review", "implementation_review", "ci", "local_acceptance", "human_acceptance"]

[invalidation.candidate_sha]
invalidates = ["implementation_review", "local_acceptance", "human_acceptance"]

[invalidation.spike_result_hash]
invalidates = ["result_review"]

[state_artifacts.plan]
kind = "mutable_comment"
artifact_key = "plan"
multiplicity = "one"

[state_artifacts.approval]
kind = "mutable_comment"
state_key = "approval"
multiplicity = "one"

[state_artifacts.delivery]
kind = "mutable_comment"
state_key = "delivery"
multiplicity = "one"

[state_artifacts.result]
kind = "mutable_comment"
artifact_key = "result"
multiplicity = "one"
modes = ["spike"]

[events]
append_only = [
  "CHANGES_REQUIRED",
  "TESTS_CHANGES_REQUIRED",
  "PLAN_INCOMPLETE",
  "MATERIAL_DEVIATION",
  "BLOCKED",
  "ACCEPTANCE_FAILED",
  "BUG_ROOT_CAUSE",
  "SPIKE_DECISION",
]

[migration]
schema_field = "workflow_schema"
migration_id_field = "migration_id"
complete_field = "migration_complete"
source_snapshot_fields = ["workflow_schema", "legacy_plan_hash", "legacy_state_comment_ids"]
resume_known_partial = true
block_on = [
  "multiple_migration_ids",
  "unknown_origin",
  "source_snapshot_mismatch",
  "duplicate_state",
  "binding_conflict",
]

[git_backends.close_selection]
origin_delivery_field = "close_origin"
origin_values = ["local_origin", "remote_only", "unknown"]
historical_delivery_fields = [
  "close_origin",
  "remote_close_authorized",
  "local_origin_close_sync",
  "candidate_sha",
  "candidate_ref",
]
historical_fields_readback_required = true
historical_fields_authorize_remote = false
persist_origin_before_backend_selection = true
origin_evidence_required = true
on_unknown_origin = "BLOCKED"
on_local_unavailable = "BLOCKED"
on_remote_only = "remote"
remote_switch_requires_separate_explicit_authorization = true
remote_switch_authorization_delivery_field = "remote_close_authorized"
preserve_existing_close_and_candidate_binding_on_stop = true
stop_record_fields = ["reason", "observed_capabilities", "stop_point", "required_local_action"]

[git_backends.local]
workflow = "implementation-loop"
executor = "local_git"

[git_backends.local.close_completion]
candidate_sha_field = "candidate_sha"
published_sha_field = "published_sha"
published_remote_field = "published_remote"
published_target_ref_field = "published_target_ref"
published_readback_field = "published_readback"
non_force_required = true
ci_success_required = true
ci_success_value = "success"
close_instruction_required = true
candidate_ancestry_required = true
historical_blocked_non_authoritative = true
resume_requires_current_evidence = true
partial_stop_resumable = true
rejected_instruction_reuse_allowed = false
local_readback_required_when_synced = true
local_sync_does_not_block_when_skipped = true

[git_backends.local.post_close_sync]
requires_close_core_complete = true
blocks_close_complete = false
fetch_required = true
source_ref = "published_target_ref"
destination_ref = "corresponding_local_branch"
fast_forward_only = true
force_update_allowed = false
reset_hard_allowed = false
auto_stash_allowed = false
rebase_allowed = false
branch_switch_allowed = false
clean_worktree_required_when_checked_out = true
skip_if_checked_out_in_other_worktree = true
cas_ref_update_when_not_checked_out = true
pre_write_compare_and_swap_required = true
post_write_readback_required = true
delivery_field = "local_post_close_sync"
outcomes = ["synced", "already_synced", "skipped", "not_applicable"]
record_fields = ["outcome", "reason", "target_ref", "local_sha", "remote_sha"]

[git_backends.remote]
workflow = "implementation-loop"
executor = "github_api"
reference = "references/remote-git.md"

[git_backends.remote.close_completion]
candidate_sha_field = "candidate_sha"
published_sha_field = "published_sha"
published_remote_field = "published_remote"
published_target_ref_field = "published_target_ref"
published_readback_field = "published_readback"
non_force_required = true
ci_success_required = true
ci_success_value = "success"
close_instruction_required = true
candidate_ancestry_required = true
historical_blocked_non_authoritative = true
resume_requires_current_evidence = true
partial_stop_resumable = true
rejected_instruction_reuse_allowed = false
local_readback_required_when_synced = true
local_sync_does_not_block_when_skipped = true

[git_backends.remote.local_origin_close]
local_sync_delivery_field = "local_origin_close_sync"
published_sha_readback_required = true
local_sha_readback_required = true
same_published_sha_required = true
pending_outcome = "AWAIT_LOCAL_SYNC"
pending_status = "Awaiting Acceptance"
skip_blocks_close_complete = true
reuse_published_candidate_on_resume = true
duplicate_publish_on_resume_allowed = false
record_fields = ["outcome", "reason", "published_target_ref", "published_sha", "local_sha", "required_local_action"]

[git_backends.remote.safety]
candidate_ref_required = true
force_update_allowed = false
pre_write_readback_required = true
post_write_readback_required = true
default_branch_update_before_acceptance = false
publish_preserves_candidate_sha = true
publish_requires_target_ancestor = true
publish_requires_allowed_commit_sequence = true
publish_readback_before_retry = true
publish_retry_limit = 1
on_diverged = "BLOCKED"

# 汎用的な差戻し。通常進行・既存Review判定を置き換えない。
[phase_return]
decision = "PHASE_RETURN"
allowed_modes = ["normal", "bug"]
source_statuses = ["Test Implementation", "Implementation", "Awaiting Acceptance"]
target_statuses = ["Todo", "Test Implementation", "Implementation"]
review_statuses_use_existing_transitions = true
required_capabilities = ["linear_read", "linear_write", "repository_read"]
on_missing_capability = "stay"
evidence_required = true
binding_consistency_required = true
candidate_provenance_required = true
on_uncertain_impact = "BLOCKED"
on_inconsistent_binding = "BLOCKED"
on_unknown_candidate = "BLOCKED"
on_invalid_target = "BLOCKED"
on_done = "BLOCKED"
revalidate_before_status = true
resume_preserves_candidate_history = true

[[phase_return.binding_returns]]
binding = "plan_hash"
source_statuses = ["Test Implementation", "Implementation", "Awaiting Acceptance"]
target_status = "Todo"
required_reviews = ["plan_review", "test_review_if_required"]
invalidates = ["plan_review", "test_review", "implementation_review", "ci", "local_acceptance", "human_acceptance"]
retains = ["baseline_sha", "candidate_history"]
clear_fields = [
  "approval.approved_plan_hash",
  "approval.approved_tests_manifest_hash",
  "delivery.candidate_sha",
  "delivery.candidate_ref",
]

[[phase_return.binding_returns]]
binding = "approved_tests_manifest"
source_statuses = ["Implementation", "Awaiting Acceptance"]
target_status = "Test Implementation"
required_reviews = ["test_review"]
invalidates = ["test_review", "implementation_review", "ci", "local_acceptance", "human_acceptance"]
retains = ["baseline_sha", "candidate_history", "unaffected_implementation", "approved_plan"]
clear_fields = [
  "approval.approved_tests_manifest_hash",
  "delivery.candidate_sha",
  "delivery.candidate_ref",
]

[[phase_return.binding_returns]]
binding = "candidate_sha"
source_statuses = ["Implementation", "Awaiting Acceptance"]
target_status = "Implementation"
required_reviews = ["implementation_review_if_test_not_required"]
invalidates = ["implementation_review", "ci", "local_acceptance", "human_acceptance"]
retains = ["baseline_sha", "candidate_history", "approved_plan", "approved_tests_manifest", "unaffected_implementation"]
clear_fields = []
