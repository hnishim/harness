interface:
  display_name: "Implementation Loop"
  short_description: "Execute approved Linear plans with test-gated review"
  default_prompt: "Use $implementation-loop with a Linear Issue ID. For Backlog, hand off to Todo only; only Todo executes plan-create-or-replan once. In Plan Review, use explicit mode=plan-review to review the existing Plan without creating a new one, then execute only its approved Plan through Test Implementation, Test Review, Implementation, and Implementation Review, preserving the approved test baseline and using bounded review cycles."

policy:
  allow_implicit_invocation: false
