interface:
  display_name: "Linear Issue Plan Review"
  short_description: "Repository確認を伴うPlan作成と独立Review"
  default_prompt: "Use $linear-issue-plan-review with the specified Linear Issue ID. For Backlog or Todo, complete planning, persist and refetch it, then continue through independent Plan Review in the same run; do not stop at In Plan Review. For In Plan Review, run the independent review directly. Never add or activate Strict profile without explicit user approval. Determine Spike mode from the Spike label only."

policy:
  allow_implicit_invocation: false
