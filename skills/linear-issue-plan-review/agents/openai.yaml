interface:
  display_name: "Linear Issue Plan Review"
  short_description: "Repository確認を伴うPlan作成と独立Review"
  default_prompt: "Use $linear-issue-plan-review with the specified Linear Issue ID. Route only from current Linear Status. In Plan Review, first check whether the plan itself is minimal and free of unnecessary scope or architecture; before any CHANGES_REQUIRED loop, also remove change requests that are not required by the issue, acceptance criteria, safety, or repository constraints. Determine Spike mode from the Spike label only and preserve Strict profile labels."

policy:
  allow_implicit_invocation: false
